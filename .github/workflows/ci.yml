name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, testes e cobertura (100%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore CatalogAspire.sln

      - name: Build (inclui o AppHost do Aspire)
        run: dotnet build CatalogAspire.sln -c Release --no-restore

      - name: Testes com cobertura (gate de 100% linha e branch)
        run: dotnet test tests/Catalog.Api.Tests/Catalog.Api.Tests.csproj -c Release --no-build
